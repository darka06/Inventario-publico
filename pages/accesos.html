<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios y roles - Inventario</title>
  <link rel="stylesheet" href="../css/styles.css?v=53">
  <link rel="stylesheet" href="../css/accesos.css?v=2">
  <link rel="icon" href="../icons/favicon.svg?v=3" type="image/svg+xml">
</head>
<body data-root="../" data-page="accesos">
  <img class="menu-btn" src="../icons/ui/menu.svg" alt="Menú" role="button" tabindex="0" aria-controls="sidebar">
  <div class="layout">
    <div class="backdrop"></div>
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content">
      <div class="page-head"><h1>Usuarios y roles</h1></div>

      <div class="ac-tabs" role="tablist" aria-label="Sección">
        <button type="button" role="tab" id="tab-users" aria-selected="true" aria-controls="panel-users">Usuarios</button>
        <button type="button" role="tab" id="tab-roles" aria-selected="false" aria-controls="panel-roles">Roles</button>
      </div>

      <section id="panel-users" role="tabpanel" aria-labelledby="tab-users"></section>
      <section id="panel-roles" role="tabpanel" aria-labelledby="tab-roles" hidden></section>
    </main>
  </div>

  <div class="modal" id="user-modal" hidden>
    <div class="modal-box sm" role="dialog" aria-modal="true" aria-labelledby="user-modal-title">
      <header class="modal-head">
        <h2 id="user-modal-title"></h2>
        <button type="button" class="modal-close" aria-label="Cerrar" data-close>✕</button>
      </header>
      <form class="modal-body ac-form" id="user-form" novalidate>
        <p class="login-error" id="user-form-error" role="alert" hidden></p>
        <label class="ac-field"><span>Nombre completo</span><input type="text" id="uf-name" maxlength="120" required></label>
        <label class="ac-field"><span>Nombre de usuario</span><input type="text" id="uf-username" maxlength="32" autocapitalize="none" spellcheck="false" autocomplete="off" required>
          <small>De 3 a 32 caracteres: minúsculas, números, punto, guion o guion bajo.</small></label>
        <label class="ac-field"><span id="uf-pass-label">Contraseña</span><input type="password" id="uf-password" maxlength="200" autocomplete="new-password">
          <small id="uf-pass-help">Mínimo 12 caracteres.</small></label>
        <div class="ac-row">
          <label class="ac-field"><span>Rol</span><select id="uf-role"></select></label>
          <label class="ac-field"><span>Estado</span><select id="uf-status"><option>Activo</option><option>Inactivo</option></select></label>
        </div>
        <footer class="ac-foot">
          <button type="button" class="ac-btn" data-close>Cancelar</button>
          <button type="submit" class="ac-btn primary" id="uf-submit">Guardar</button>
        </footer>
      </form>
    </div>
  </div>

  <script src="../js/sidebar-render.js?v=34"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/api-client.js?v=4"></script>
  <script src="../js/float-windows.js?v=1"></script><script src="../js/accesos.js?v=2"></script>
</body>
</html>
